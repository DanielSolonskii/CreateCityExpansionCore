; TEMPLATE ONLY. Stage through controlled deployment, not ordinary builds.
foreground = yes
pid =
syslog = yes
debug = notice
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1

[minecraft]
; Public IP must be assigned to the VDS; wildcard would conflict with raw loopback TCP.
accept = 186.246.28.214:25565
connect = 127.0.0.1:25565
cert = /run/credentials/create-server-game-tls.service/game-cert
key = /run/credentials/create-server-game-tls.service/game-key
sslVersionMin = TLSv1.2

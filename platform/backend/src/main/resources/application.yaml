server:
  address: ${PLATFORM_BIND_ADDRESS:127.0.0.1}
  port: ${PLATFORM_API_PORT:8080}

spring:
  application:
    name: create-server-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:create_server}
    username: ${POSTGRES_USER:create_server}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

platform:
  accounts:
    telegram-bot-username: ${TELEGRAM_BOT_USERNAME:}
    bot-backend-secret: ${BOT_BACKEND_SECRET:}
    registration-ttl-seconds: ${REGISTRATION_TTL_SECONDS:900}

# Database errors may include failing rows with password hashes: never log them.
logging:
  level:
    org.hibernate.orm.jdbc.error: 'OFF'
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: 'OFF'

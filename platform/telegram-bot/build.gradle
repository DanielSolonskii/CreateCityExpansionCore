plugins {
    id 'java'
    id 'application'
}
group = 'dev.createserver'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    implementation 'tools.jackson.core:jackson-databind'
    implementation('com.squareup.okhttp3:okhttp') { version { strictly '4.12.0' } }
    testImplementation('com.squareup.okhttp3:mockwebserver') { version { strictly '4.12.0' } }
    testImplementation('com.squareup.okhttp3:okhttp-tls') { version { strictly '4.12.0' } }
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'dev.createserver.bot.BotMain' }
tasks.named('test') { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

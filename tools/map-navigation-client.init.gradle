// Opt-in, one graphical client and one new integrated test world per invocation.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def links = project.hasProperty('mapLinksOnly')
    def editor = project.hasProperty('mapPassengerEditor')
    def ride = links || editor || project.hasProperty('mapRideClient')
    def directory = project.file("build/map-stage6/client-${UUID.randomUUID()}")
    def probe = project.sourceSets.create('mapNavigationClientTest') {
        resources.srcDirs = []
        if (ride) {
            java.srcDir('src/mineVisualTest/java')
            java.include('com/example/examplemod/client/map/Navigation*.java',
                    'com/example/examplemod/navigation/JourneyTripGameTest.java',
                    'com/example/examplemod/passenger/PassengerRestartCheck.java')
            resources.srcDir('src/mineVisualTest/resources')
            resources.include('data/createcityexpansioncore/structure/atlas_interchange.nbt')
        } else java.exclude('**/NavigationRide*.java')
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.runtimeClasspath
    }
    def markers = project.hasProperty('navigationMarkersOnly')
    def cityEditor = project.hasProperty('navigationCityEditor')
    def scope = cityEditor ? 'city-editor' : editor ? 'editor' : links ? 'links' : ride ? 'ride' : markers ? 'markers' : 'navigator'
    [project.sourceSets.main, probe].each { set ->
            def output = project.file("build/map-stage6/${scope}-classes/${set.name}")
            set.java.destinationDirectory.set(output)
            project.tasks.named(set.compileJavaTaskName).configure {
                destinationDirectory.set(output)
                options.incremental = false
            }
            def resources = project.file("build/map-stage6/${scope}-resources/${set.name}")
            set.output.resourcesDir = resources
            project.tasks.named(set.processResourcesTaskName).configure { destinationDir = resources }
    }
    project.tasks.named(probe.processResourcesTaskName).configure { from(project.sourceSets.main.output) }
    project.neoForge.mods.named(project.mod_id).configure { modSourceSets.set([probe]) }
    project.neoForge.runs.named('client').configure {
        gameDirectory = directory
        systemProperty 'ccec.qa.dir', directory.canonicalPath
        if (ride) {
            systemProperty 'ccec.qa.interactiveRide', 'true'
            systemProperty 'ccec.qa.passengerEditor', editor.toString()
            systemProperty 'ccec.qa.linksOnly', links.toString()
            systemProperty 'ccec.qa.interactiveRoot', directory.canonicalPath
        }
        systemProperty 'ccec.telemetry.disabled', 'true'
        systemProperty 'ccec.map.diagnostics', 'true'
        systemProperty 'ccec.qa.dimensionOnly', project.providers.gradleProperty('navigationDimensionOnly').isPresent().toString()
        systemProperty 'ccec.qa.formsOnly', project.providers.gradleProperty('navigationFormsOnly').isPresent().toString()
        systemProperty 'ccec.qa.markersOnly', markers.toString()
        systemProperty 'ccec.qa.cityEditor', cityEditor.toString()
        systemProperty 'ccec.qa.metricsOnly', project.providers.gradleProperty('navigationMetricsOnly').isPresent().toString()
        systemProperty 'ccec.qa.engineeringOnly', project.providers.gradleProperty('navigationEngineeringOnly').isPresent().toString()
    }
    project.tasks.named('prepareDevMods').configure { enabled = false }
    def assets = project.tasks.register('prepareMapNavigationClient', Copy) {
        from(project.configurations.devRuntimeMods)
        from(project.configurations.tfmgDevMod)
        from(project.file('libs/electroenergetics-1.21.1-1.1.2.jar'))
        into(new File(directory,'mods'))
        doLast {
            new File(directory,'options.txt').setText('onboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nlang:ru_ru\nrenderDistance:6\nsimulationDistance:5\nguiScale:1\nmaxFps:120\n', 'UTF-8')
            def config = new File(directory, 'config')
            config.mkdirs()
            new File(config,'ccec-minimap.properties').setText('enabled=false\n', 'UTF-8')
        }
    }
    project.tasks.named('runClient').configure {
        dependsOn assets, probe.classesTaskName
        maxHeapSize = "1800m"
        jvmArgs "-XX:ActiveProcessorCount=4"
        doLast {
            def result = new File(directory,'navigation-client.txt')
            if (!result.isFile() || result.readLines('UTF-8').last() != 'PASS') throw new GradleException("Client QA failed: "+result)
            logger.lifecycle("Passed isolated navigator client acceptance: "+result)
        }
    }
}

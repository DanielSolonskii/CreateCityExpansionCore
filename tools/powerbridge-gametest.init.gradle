// Run with -I tools/powerbridge-gametest.init.gradle runGameTestServer.
// Add -PpowerBridgeWithoutTfmg to verify NeoForge rejects the missing dependency before starting the world.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def withTfmg = !p.hasProperty("powerBridgeWithoutTfmg")
    def game = p.layout.buildDirectory.dir("checks/powerbridge-" + (withTfmg ? "with-tfmg" : "without-tfmg"))
    def verifiedMods = p.tasks.named("verifyDevMods").get()
    def mods = p.tasks.register("preparePowerBridgeTestMods", Copy) {
        dependsOn verifiedMods
        from(verifiedMods.inputs.files) {
            if (!withTfmg) exclude("tfmg-1.2.0.jar")
        }
        into(game.map { it.dir("mods") })
    }
    if (withTfmg) {
        def test = p.sourceSets.create("powerBridgeWithTfmgGameTest")
        test.java.srcDir("src/powerBridgeGameTest/java")
        test.resources.srcDir("src/powerBridgeGameTest/resources")
        test.java.include("**/DcBridgeGameTest.java")
        test.compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        p.neoForge.mods.named(p.mod_id).configure { sourceSet(test) }
        p.tasks.named("runGameTestServer") { dependsOn p.tasks.named(test.classesTaskName) }
    }
    p.neoForge.runs.named("gameTestServer").configure {
        gameDirectory = game.get().asFile
        logLevel = org.slf4j.event.Level.INFO
        systemProperty "neoforge.enableGameTest", "true"
    }
    p.tasks.named("runGameTestServer") {
        dependsOn mods
        if (!withTfmg) {
            ignoreExitValue = true
            doFirst {
                standardOutput = new ByteArrayOutputStream()
                errorOutput = standardOutput
            }
            doLast {
                def log = standardOutput.toString('UTF-8')
                // Minecraft Main logs startup exceptions and can return zero after refusing to start.
                def startupFailed = log.contains("Failed to start the minecraft server") &&
                    log.contains("net.neoforged.fml.ModLoadingException: Loading errors encountered:")
                def missingTfmg = log.contains("Mod createcityexpansioncore requires tfmg 1.2.0") &&
                    log.contains("Currently, tfmg is not installed")
                if (!startupFailed || !missingTfmg) {
                    throw new GradleException("Expected NeoForge to reject CCEC because TFMG is missing.\n" + log.takeRight(4000))
                }
                logger.lifecycle("PASS: NeoForge rejected CCEC at startup because TFMG 1.2.0 is missing (process exit ${executionResult.get().exitValue}).")
            }
        }
    }
}

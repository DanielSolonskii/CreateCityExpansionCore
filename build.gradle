tasks.register('checkNoCreateSplitPackage') {
    dependsOn tasks.named('jar')
    inputs.file(ccecProductionJar)
    doLast {
        def archive = inputs.files.singleFile
        def forbidden = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('com/simibubi/create/')) forbidden.add(entry.name)
            }
        }
        if (!forbidden.empty) throw new GradleException("CCEC jar contains forbidden Create split-package classes: ${forbidden}")
    }
}
tasks.named('check') { dependsOn tasks.named('checkNoCreateSplitPackage') }


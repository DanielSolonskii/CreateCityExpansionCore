tasks.register('checkNoCreateSplitPackage') {
    dependsOn tasks.named('jar')
    inputs.file(ccecProductionJar)
    doLast {
        def archive = inputs.files.singleFile
        def forbidden = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('com/simibubi/create/')) forbidden.add(entry.name)
            }
        }
        if (!forbidden.empty) throw new GradleException("CCEC jar contains forbidden Create split-package classes: ${forbidden}")
    }
}
tasks.named('check') { dependsOn tasks.named('checkNoCreateSplitPackage') }

// Each headless JVM owns its log directory even when Gradle runs checks in parallel.
tasks.withType(JavaExec).configureEach {
    if (name in ['checkMineVisualCoordinates', 'checkFreightLogistics', 'checkLogisticsLayout', 'checkRailwayOwnership', 'checkRailwayTripAccounting', 'checkCityRelations', 'checkCityTerritory', 'checkCityTerritoryDelivery', 'checkCityMapTextLayout', 'checkWorldMapV2', 'checkWorldMapUiLayout', 'checkUnifiedStatus', 'checkFreightDispatch', 'checkFreightReconciliation', 'checkTrainManagement', 'checkFreightHandoff', 'checkShipmentPackageIdentity', 'checkFreightArrivalSettlement', 'checkGameplayRestrictions', 'checkKelpGrowthPolicy', 'checkCityMapReadAccess', 'checkCityWorldMapSession', 'checkWorldMapPanelLifecycle', 'checkChunkLoader', 'checkDependencyRecipeOverrides', 'checkCityInviteSearch', 'checkCityInviteUiLayout', 'checkCityPylonUiLayout', 'checkCityPylonMembersLayout', 'checkConnectionAdmission', 'checkAuthenticationStartupPolicy', 'checkReportLimits']) {
        workingDir = layout.buildDirectory.dir("checks/${name}").get().asFile
        doFirst { workingDir.mkdirs() }
    }
}


// Pinned to the existing pack. Full mods must not leak into runtimeClasspath:
// NeoForge loads their embedded JarJar dependencies from run/mods instead.
configurations {
    devRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    // KineticBlockEntity exposes Ponder's VirtualBlockEntity in its hierarchy.
    // Maven replaces the old compileOnly files('run/mods/...') prerequisite.
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') {
        transitive = false
    }
    devRuntimeMods 'com.simibubi.create:create-1.21.1:6.0.10-280'
    devRuntimeMods 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
}

def devModsDirectory = layout.projectDirectory.dir('run/mods').asFile
def expectedDevMods = [
    'create-1.21.1-6.0.10.jar',
    'ponder-neoforge-1.0.82+mc1.21.1.jar',
    'electroenergetics-1.21.1-1.1.2.jar'
]

def prepareDevMods = tasks.register('prepareDevMods', Copy) {
    group = 'mod development'
    description = 'Download pinned Create/Ponder and copy required runtime mods to run/mods without deleting other files.'
    from(configurations.devRuntimeMods)
    // Existing dependency is already tracked in Git; never copy a user's instance.
    from(layout.projectDirectory.file('libs/electroenergetics-1.21.1-1.1.2.jar'))
    into(devModsDirectory)
    rename('create-1.21.1-6.0.10-280.jar', 'create-1.21.1-6.0.10.jar')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // Gradle ignores newly added files in output directories for up-to-date checks.
    // Always run the non-destructive conflict guard before a development launch.
    outputs.upToDateWhen { false }
    doFirst {
        def conflicts = (devModsDirectory.listFiles() ?: []).findAll { candidate ->
            candidate.name.endsWith('.jar') &&
                ['create-', 'ponder-', 'electroenergetics-'].any { candidate.name.startsWith(it) } &&
                !expectedDevMods.contains(candidate.name)
        }
        if (!conflicts.empty) {
            throw new GradleException("Conflicting dev mods: ${conflicts*.name}. Move those files out of run/mods before preparing pinned dependencies; nothing was deleted.")
        }
    }
}

// Existing ModDevGradle run layout uses run/ for client/server/data.
// Build/check only resolve compile dependencies; no game is started implicitly.
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach {
    dependsOn prepareDevMods
}

tasks.register('verifyDevMods') {
    group = 'verification'
    description = 'Check prepared jars and Create embedded companions without starting Minecraft.'
    dependsOn prepareDevMods
    inputs.files(expectedDevMods.collect { new File(devModsDirectory, it) })
    doLast {
        expectedDevMods.each { name ->
            if (!new File(devModsDirectory, name).isFile()) throw new GradleException("Missing development mod: ${name}")
        }
        new java.util.zip.ZipFile(new File(devModsDirectory, 'create-1.21.1-6.0.10.jar')).withCloseable { zip ->
            ['META-INF/jarjar/flywheel-neoforge-1.21.1-1.0.6.jar',
             'META-INF/jarjar/Registrate-MC1.21-1.3.0+67.jar',
             'META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar'].each { name ->
                if (zip.getEntry(name) == null) throw new GradleException("Full Create jar missing embedded companion: ${name}")
            }
        }
        logger.lifecycle('Verified Create 6.0.10, Ponder 1.0.82, Electro Energetics 1.1.2 and embedded Flywheel 1.0.6 / Registrate.')
    }
}
